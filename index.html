<!doctype html><html lang="ko" class=""><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-UmniQndsbf7IZqhZ5wWBDu7BDwDFs3NEY3xgc1DSb58='; style-src 'sha256-qKy/fLjybpl7XNhRZDYbYiokLfwUoYp9Yg/DXt8wl8s='; img-src blob: data:; media-src blob:; form-action 'none'; base-uri 'none'; connect-src https://api.whatsonchain.com">
<title>BSV 지갑 조회기</title><style>:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1B2733; --muted:#5A6878; --line:#CBD3DC;
  --brass:#9A7630; --brass-ink:#FFFFFF; --bad:#B3261E; --ok:#2E6B4F;
  color-scheme: light;
}
.vault{
  --bg:#152230; --panel:#1E2E3F; --ink:#EDE6D6; --muted:#9FB0C2; --line:#34485D;
  --brass:#C9A24E; --brass-ink:#152230; --bad:#F2877D; --ok:#7CC3A0;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.6 system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:20px 20px 32px;padding:max(20px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
#app{max-width:460px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
header{padding:8px 0 6px;border-bottom:2px solid var(--brass);margin-bottom:6px}
h1{font-size:1.6rem;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.25;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.lead{margin:0}
.note{color:var(--muted);font-size:.88rem;margin:0}
.warn{background:var(--bad);color:#fff;padding:12px 14px;border-radius:6px;margin:0}
.err{color:var(--bad);min-height:1em;margin:0;font-weight:600}
button,.shot{display:block;width:100%;font:inherit;font-weight:600;padding:15px 16px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;cursor:pointer}
button small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
button.primary,.shot{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
button.primary small{color:inherit;opacity:.8}
button.quiet{background:none;border-color:transparent;color:var(--muted);text-align:center;font-weight:500}
button.danger{border-color:var(--bad);color:var(--bad);background:none}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,.shot:focus-within{outline:3px solid var(--brass);outline-offset:2px}
.menu{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.shot{text-align:center;position:relative}
.shot.small{padding:10px;font-size:.9rem;background:var(--panel);color:var(--ink);border-color:var(--line)}
.shot input{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;width:100%;cursor:pointer}
label{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-weight:600;font-size:.95rem}
label small{font-weight:400;color:var(--muted);font-size:.83rem}
label.check{grid-auto-flow:column;grid-template-columns:auto 1fr;justify-content:start;align-items:center;font-weight:500}
input,textarea{font:inherit;font-weight:400;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
label.check input{width:auto;transform:scale(1.3)}
.words{list-style:none;counter-reset:w;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.words li{counter-increment:w;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-weight:600}
.words li::before{content:counter(w);color:var(--brass);font-size:.75rem;margin-right:6px;font-weight:700}
.qr{display:flex;justify-content:center}
.qr canvas{border-radius:6px;max-width:100%;height:auto!important}
.addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.02rem;word-break:break-all;margin:0;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.7}
.addr span:nth-child(odd){color:var(--brass)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:.85rem}
.pay{border:1.5px solid var(--brass);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.lbl{margin:0;color:var(--muted);font-size:.85rem;font-weight:600}
.amt{margin:0;font-size:1.6rem;font-weight:700;line-height:1.2}
.amt small{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{color:var(--muted);font-size:.9rem}.facts dd{margin:0;font-weight:600}
.facts .bad{color:var(--bad)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:center}.row button{text-align:center}
.pg{white-space:nowrap;color:var(--muted)}
.balance{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.big{font-size:2.1rem;font-weight:700;margin:0;line-height:1.1;letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1/1;min-height:260px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;top:18%;right:18%;bottom:18%;left:18%;border:3px solid var(--brass);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.scanmsg{margin:0;font-size:.92rem;color:var(--muted);min-height:1.4em}
.scanmsg.err{color:var(--bad);font-weight:600}
.shot.alt{background:var(--panel);color:var(--ink);border-color:var(--line);margin-top:10px}
button.small{padding:10px;font-size:.9rem;text-align:center}
.pw{position:relative;display:block}
.pw input{padding-right:84px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;padding:6px 12px;font-size:.85rem;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.wl{font-size:.8rem;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.ver{text-align:center;margin-top:8px}
.tag{font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid var(--brass);color:var(--brass);margin-left:6px;vertical-align:2px}
</style></head>
